[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teletrader"
version = "0.1.0"
description = "Listen to Telegram trading signals and (eventually) place broker trades."
requires-python = ">=3.12"
dependencies = [
    "telethon==1.36.0",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
